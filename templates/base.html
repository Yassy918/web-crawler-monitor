<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{% block title %}WebCrawler Monitor{% endblock %}</title>
<script>
/* 描画前に配色を決める: 保存した選択 > 端末の設定 */
(function () {
  var KEY = 'wcm-theme';
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  function saved() {
    var v = null;
    try { v = localStorage.getItem(KEY); } catch (e) {}
    return v === 'light' || v === 'dark' ? v : null;
  }
  function system() { return mq && mq.matches ? 'light' : 'dark'; }
  root.setAttribute('data-theme', saved() || system());
  /* 一度も選んでいない間は、端末の設定変更に追従する */
  function follow() { if (!saved()) root.setAttribute('data-theme', system()); }
  if (mq) {
    if (mq.addEventListener) mq.addEventListener('change', follow);
    else if (mq.addListener) mq.addListener(follow);
  }
  window.wcmSetTheme = function (t) {
    if (t !== 'light' && t !== 'dark') return;
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(KEY, t); } catch (e) {}
  };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1218; --nav: #0A0E13; --nav-line: #232C37;
  --surface: #151B23; --sunken: #11161D; --meta: #1B232D;
  --border: #2A3441; --line: #232C37;
  --ink: #E8EEF5; --ink2: #B5C2D1; --muted: #9AA8B8; --icon: #7B8A9C;
  --accent: #5BC0FF; --on-accent: #08121C; --seg-on: #1B2A3B;
  --chip-on: #10283D; --chip-on-ink: #E3F2FF; --chip-off-line: #3A4756; --chip-box: #7B8A9C;
  --ch-bg: #3A2A07; --ch-ink: #FFC657;
  --nw-bg: #0F2A4A; --nw-ink: #8CC4FF;
  --e404-bg: #3A2410; --e404-ink: #FFB27A;
  --err-bg: #4A1717; --err-ink: #FFA3A3;
  --ok-bg: #10301F; --ok-ink: #7FDCA0;
  --unk-bg: #263040; --unk-ink: #B5C2D1;
  --add-bg: #10321F; --add-ink: #C8F6D8; --add-sign: #5FD68A;
  --del-bg: #3A161B; --del-ink: #FFC9CF; --del-sign: #FF8A96;
  --ctx: #D5DEE8; --url: #C3CFDC;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F5F8; --nav: #FFFFFF; --nav-line: #DDE3EA;
  --surface: #FFFFFF; --sunken: #FBFCFD; --meta: #EEF2F7;
  --border: #DDE3EA; --line: #E7EBF0;
  --ink: #121C27; --ink2: #3F4C5A; --muted: #4F5E6E; --icon: #6B7B8C;
  --accent: #1D4ED8; --on-accent: #FFFFFF; --seg-on: #E6EDFD;
  --chip-on: #E6EDFD; --chip-on-ink: #14308C; --chip-off-line: #C5CEDA; --chip-box: #8696A8;
  --ch-bg: #FFF0D1; --ch-ink: #7A4300;
  --nw-bg: #E0ECFF; --nw-ink: #123E8F;
  --e404-bg: #FFEDD5; --e404-ink: #9A3412;
  --err-bg: #FDE3E3; --err-ink: #8A1C1C;
  --ok-bg: #E4F3EA; --ok-ink: #14532D;
  --unk-bg: #E9EDF2; --unk-ink: #3F4C5A;
  --add-bg: #D9F2E0; --add-ink: #0F3D22; --add-sign: #14532D;
  --del-bg: #FBE0E0; --del-ink: #7A1B1B; --del-sign: #A12020;
  --ctx: #1F2B38; --url: #1F2B38;
}
/* JavaScript が使えない場合のみ、端末の設定に合わせる */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #F3F5F8; --nav: #FFFFFF; --nav-line: #DDE3EA;
    --surface: #FFFFFF; --sunken: #FBFCFD; --meta: #EEF2F7;
    --border: #DDE3EA; --line: #E7EBF0;
    --ink: #121C27; --ink2: #3F4C5A; --muted: #4F5E6E; --icon: #6B7B8C;
    --accent: #1D4ED8; --on-accent: #FFFFFF; --seg-on: #E6EDFD;
    --chip-on: #E6EDFD; --chip-on-ink: #14308C; --chip-off-line: #C5CEDA; --chip-box: #8696A8;
    --ch-bg: #FFF0D1; --ch-ink: #7A4300;
    --nw-bg: #E0ECFF; --nw-ink: #123E8F;
    --e404-bg: #FFEDD5; --e404-ink: #9A3412;
    --err-bg: #FDE3E3; --err-ink: #8A1C1C;
    --ok-bg: #E4F3EA; --ok-ink: #14532D;
    --unk-bg: #E9EDF2; --unk-ink: #3F4C5A;
    --add-bg: #D9F2E0; --add-ink: #0F3D22; --add-sign: #14532D;
    --del-bg: #FBE0E0; --del-ink: #7A1B1B; --del-sign: #A12020;
    --ctx: #1F2B38; --url: #1F2B38;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  font-size: 15px; line-height: 1.6;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "BIZ UDGothic", "MS Gothic", monospace;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.nav { background: var(--nav); border-bottom: 1px solid var(--nav-line); }
.nav-inner {
  max-width: 1040px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); min-height: 60px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 16px;
}
.brand { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.logo {
  width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
}
.brand-name { font-size: 16px; font-weight: 700; }
.brand-sub { font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.seg button {
  display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
  border: 1.5px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); border-color: var(--accent); }

.wrap {
  max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding: clamp(12px, 4vw, 40px) clamp(16px, 4vw, 32px) 64px;
}
h1 { margin: 0; font-size: clamp(22px, 5vw, 26px); line-height: 1.3; font-weight: 700; }
h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }

.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 6px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.b-changed  { background: var(--ch-bg);   color: var(--ch-ink); }
.b-new      { background: var(--nw-bg);   color: var(--nw-ink); }
.b-error404 { background: var(--e404-bg); color: var(--e404-ink); }
.b-error    { background: var(--err-bg);  color: var(--err-ink); }
.b-ok       { background: var(--ok-bg);   color: var(--ok-ink); }
.b-unknown  { background: var(--unk-bg);  color: var(--unk-ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
{% block page_css %}{% endblock %}
</style>
</head>
<body>
<nav class="nav" aria-label="メイン">
  <div class="nav-inner">
    <div class="brand">
      <span class="logo"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <span class="brand-name">WebCrawler</span>
      <span class="brand-sub">Monitor</span>
    </div>
    <div class="seg" role="group" aria-label="配色の切り替え">
      <button type="button" data-set-theme="dark" aria-label="ダーク配色" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button type="button" data-set-theme="light" aria-label="ライト配色" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script>
(function () {
  var btns = document.querySelectorAll('[data-set-theme]');
  function sync() {
    var t = document.documentElement.getAttribute('data-theme');
    btns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-set-theme') === t));
    });
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () { window.wcmSetTheme(b.getAttribute('data-set-theme')); });
  });
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  sync();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
