{# 状態の種類: changed / new / error404 / error / ok / unknown #}
{% macro icon(kind, size=14) -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
{%- if kind == 'changed' %}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif kind == 'new' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
{%- elif kind == 'error404' %}<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>
{%- elif kind == 'error' %}<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
{%- elif kind == 'ok' %}<path d="m5 12 5 5 9-10"/>
{%- else %}<path d="M6 12h12"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro badge(kind, label) -%}
<span class="badge b-{{ kind }}">{{ icon(kind) }}{{ label }}</span>
{%- endmacro %}
